<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Clientes</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; padding: 5px 10px; text-decoration: none; color: white; border-radius: 4px; font-size: 12px; }
        .btn-primary { background-color: #007bff; padding: 5px 10px; text-decoration: none; color: white; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cadastro de Cliente</h2>
    <form th:action="@{/clientes/salvar}" th:object="${clienteModel}" method="post">
        <input type="hidden" th:field="*{id}" />
        
        <label>Nome do Cliente:</label>
        <input type="text" th:field="*{nome}" placeholder="Nome Completo" required />

        <label>CPF:</label>
        <input type="text" th:field="*{cpf}" placeholder="000.000.000-00" required />

        <button type="submit">Salvar</button>
    </form>
</div>

<h3 style="margin-top: 30px;">Clientes Cadastrados</h3>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="cli : ${clientes}">
            <td th:text="${cli.id}"></td>
            <td th:text="${cli.nome}"></td>
            <td th:text="${cli.cpf}"></td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${cli.id})}" class="btn-primary">Editar</a>
                <a th:href="@{/clientes/excluir/{id}(id=${cli.id})}" class="btn-danger" onclick="return confirm('Tem certeza?')">Excluir</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
